<!DOCTYPE html>
<!-- Arah: menu PDF sederhana untuk pemindai QR di meja, gaya kertas krem dan marun dari brosur. Dial: ENERGY 1 / RHYTHM 1 / MOTION 1, loader satu-kali sebagai momen brand. -->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Menu digital Baara Ria, Nusantara Smoked and Grilled. Scroll seperti PDF.">
  <title>Baara Ria - Menu</title>
  <link rel="preload" as="image" href="assets/cover.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="loader" id="loader" role="status" aria-label="Memuat menu Baara Ria">
    <div class="load-art" aria-hidden="true">
      <img class="art-base" src="iconsvg.svg" alt="">
      <div class="wipe"><img src="iconsvg.svg" alt=""></div>
    </div>
    <p class="load-brand">Baara Ria</p>
    <p class="load-sub">Menyiapkan menu...</p>
  </div>
  <noscript><style>.loader{display:none}</style></noscript>

  <div class="progress" id="progress"></div>

  <div class="sticky">
    <header class="top">
      <button class="burger" id="burger" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="side"><span></span><span></span><span></span></button>
      <a class="brand" href="#atas" aria-label="Baara Ria, kembali ke atas">
        <span class="brand-logo"><img src="logohead.svg" alt=""></span>
      </a>
      <span class="count" id="count">1 / 7</span>
    </header>
  </div>

  <aside class="side" id="side" aria-label="Navigasi menu">
    <button class="side-x" id="sideX" type="button" aria-label="Tutup menu">×</button>
    <a class="side-logo" href="#atas" aria-label="Baara Ria, kembali ke atas"><img src="logohead.svg" alt=""></a>
    <p class="side-tag">Nusantara Smoked and Grilled</p>
    <nav class="sidenav" id="sidenav" aria-label="Lompat ke halaman">
      <a href="#p0" class="on">Cover</a>
      <a href="#p1"><b>1</b>Smoked</a>
      <a href="#p2"><b>2</b>Classic</a>
      <a href="#p3"><b>3</b>Sup</a>
      <a href="#p4"><b>4</b>Nasi</a>
      <a href="#p5"><b>5</b>Sambal</a>
      <a href="#p6"><b>6</b>Minuman</a>
    </nav>
    <div class="side-bottom">
      <button class="dl-btn" id="dlSide" type="button">Downloads Asset</button>
      <p class="side-count" id="sideCount">1 / 7</p>
    </div>
  </aside>

  <main class="doc" id="atas">
    <section class="intro">
    </section>

    <figure class="page" id="p0">
      <figcaption><span>Cover</span></figcaption>
      <img src="assets/cover.jpg" alt="Cover menu Baara Ria" fetchpriority="high" tabindex="0" role="button" aria-label="Perbesar cover menu">
    </figure>

    <figure class="page" id="p1">
      <figcaption><span>Hal 1</span> Smoked &amp; Grilled</figcaption>
      <img src="assets/halaman-1.jpg" alt="Se'i sapi asap, sate maranggi, dendeng bakar" loading="lazy" tabindex="0" role="button" aria-label="Perbesar halaman 1, Smoked and Grilled">
    </figure>

    <figure class="page" id="p2">
      <figcaption><span>Hal 2</span> Classic Beef Nusantara</figcaption>
      <img src="assets/halaman-2.jpg" alt="Rendang, empal gepuk, asam padeh" loading="lazy" tabindex="0" role="button" aria-label="Perbesar halaman 2, Classic Beef">
    </figure>

    <figure class="page" id="p3">
      <figcaption><span>Hal 3</span> Spesial Sup Nusantara</figcaption>
      <img src="assets/halaman-3.jpg" alt="Gulai, pallubasa, rawon" loading="lazy" tabindex="0" role="button" aria-label="Perbesar halaman 3, Sup Nusantara">
    </figure>

    <figure class="page" id="p4">
      <figcaption><span>Hal 4</span> Nasi &amp; Lontong</figcaption>
      <img src="assets/halaman-4.jpg" alt="Nasi biasa, nasi daun jeruk, nasi uduk, lontong, nasi merah" loading="lazy" tabindex="0" role="button" aria-label="Perbesar halaman 4, Nasi dan Lontong">
    </figure>

    <figure class="page" id="p5">
      <figcaption><span>Hal 5</span> Sambal</figcaption>
      <img src="assets/halaman-5.jpg" alt="Aneka sambal Baara Ria" loading="lazy" tabindex="0" role="button" aria-label="Perbesar halaman 5, Sambal">
    </figure>

    <figure class="page" id="p6">
      <figcaption><span>Hal 6</span> Minuman</figcaption>
      <img src="assets/halaman-6.jpg" alt="Aneka minuman Baara Ria" loading="lazy" tabindex="0" role="button" aria-label="Perbesar halaman 6, Minuman">
    </figure>

    <footer class="foot">
      <button class="dl-btn light" id="dlFoot" type="button">Downloads Asset</button>
      <a href="#atas">Kembali ke atas</a>
    </footer>
  </main>
